name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, blank = v<versionName>-yyyyMMddHHmm or v<versionName>-beta-yyyyMMddHHmm"
        required: false
        type: string
      release_channel:
        description: "Release channel, auto uses beta on fongmi-sync"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
      sync_cnb:
        description: "Mirror APKs to CNB Release and sync CNB manifests"
        required: false
        default: false
        type: boolean
      publish_oci:
        description: "Publish APKs as OCI artifacts when Registry variables and secrets are configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  CNB_API_ENDPOINT: https://api.cnb.cool
  CNB_WEB_ENDPOINT: https://cnb.cool
  CNB_REPO_SLUG: fish2035/webhtv-release
  CNB_REPO_URL: https://cnb.cool/fish2035/webhtv-release.git

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify mobile search scope feature is present
        run: |
          set -euo pipefail
          grep -q 'android:id="@+id/modeAll"' app/src/mobile/res/layout/fragment_search.xml
          grep -q 'android:id="@+id/modeSelected"' app/src/mobile/res/layout/fragment_search.xml
          grep -q 'android:id="@+id/selectAll"' app/src/mobile/res/layout/dialog_site.xml
          grep -q 'android:id="@+id/invert"' app/src/mobile/res/layout/dialog_site.xml
          grep -q 'SCOPE_SELECTED' app/src/mobile/java/com/fongmi/android/tv/ui/fragment/SearchFragment.java
          grep -q 'getPic(), getWallPic(), mScope' app/src/mobile/java/com/fongmi/android/tv/ui/fragment/SearchFragment.java
          grep -q 'public void invert()' app/src/mobile/java/com/fongmi/android/tv/ui/adapter/SiteAdapter.java
          grep -q 'public SiteDialog range()' app/src/mobile/java/com/fongmi/android/tv/ui/dialog/SiteDialog.java
          grep -q 'string name="search_scope_selected"' app/src/mobile/res/values-zh/strings.xml
          # 原有 block/search 两个按钮必须一直在，不允许再按 range 隐藏
          grep -q 'android:id="@+id/block"' app/src/mobile/res/layout/dialog_site.xml
          grep -q 'android:id="@+id/search"' app/src/mobile/res/layout/dialog_site.xml
          ! grep -q 'binding.block.setVisibility' app/src/mobile/java/com/fongmi/android/tv/ui/dialog/SiteDialog.java
          ! grep -q 'binding.search.setVisibility' app/src/mobile/java/com/fongmi/android/tv/ui/dialog/SiteDialog.java
          # 分类筛选第一个按钮 = 全部（所有站点列表弹窗）
          grep -q 'getGroupView("")' app/src/mobile/java/com/fongmi/android/tv/ui/dialog/SiteDialog.java
          grep -q 'string name="site_group_all"' app/src/mobile/res/values-zh/strings.xml
          # 三模式按钮选中态用项目已有的 yellow 色表
          grep -q '@color/yellow' app/src/mobile/res/layout/fragment_search.xml
          echo "Mobile search scope feature verified in source before build"
          # 弹窗窗口参数必须在 show 之前应用，避免首帧居中后跳位（A 类 bug）
          grep -q 'applyWindow(dialog, context, landFactor, portFactor, maxDp);' app/src/main/java/com/fongmi/android/tv/ui/dialog/LightDialog.java
          grep -q 'if (window != null) applyWindow(window);' app/src/main/java/com/fongmi/android/tv/ui/dialog/ChoiceDialog.java
          echo "Dialog window applied before show in both shared dialog classes"
          # 自动简繁转换必须保持关闭（不跟随系统地区自动转繁体）
          grep -q 'Trans.setTraditional(false);' app/src/main/java/com/fongmi/android/tv/setting/Setting.java
          grep -q 'DEFAULT_ENABLE = false;' catvod/src/main/java/com/github/catvod/utils/Trans.java
          ! grep -q '"TW".equals' catvod/src/main/java/com/github/catvod/utils/Trans.java
          echo "Auto traditional conversion is disabled"
          # 远程托管弹窗：6 个子弹窗的窗口参数必须在 show 之前应用
          test "$(grep -c '窗口参数必须在 show 之前定好' app/src/main/java/com/fongmi/android/tv/ui/dialog/RemoteTrustDialog.java)" -eq 6
          echo "Remote trust dialog windows applied before show"

      - name: Run WebSocket danmaku tests
        id: unit_tests
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew \
            :app:testMobileArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.player.danmaku.*' \
            --no-daemon 2>&1 | tee /tmp/gradle-unit-test.log

      - name: Report Gradle failure details
        if: failure() && steps.unit_tests.outcome == 'failure'
        run: |
          echo "::group::Gradle failure detail"
          if [ -f /tmp/gradle-unit-test.log ]; then
            grep -nE "error:|^e: |FAILED|What went wrong|Execution failed|Caused by:|AAPT|Android resource linking failed|cannot find symbol|package .* does not exist|Tests? failed|AssertionError|java\.lang\.|BUILD FAILED|FAILURE:" /tmp/gradle-unit-test.log | tail -70 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          echo "::endgroup::"

      - name: Resolve release tag
        id: meta
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          CHANNEL="${{ inputs.release_channel }}"
          if [ "$CHANNEL" = "auto" ] || [ -z "$CHANNEL" ]; then
            if [ "${{ github.ref_name }}" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          if [ "$CHANNEL" = "beta" ]; then
            APK_SUFFIX="-beta"
            TAG_PATTERN="^v${VERSION_NAME}-beta-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-beta-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-beta-yyyyMMddHHmm"
          else
            APK_SUFFIX=""
            TAG_PATTERN="^v${VERSION_NAME}-[0-9]{12}$"
            TAG_DEFAULT="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="v${VERSION_NAME}-yyyyMMddHHmm"
          fi
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error title=Invalid release tag::Expected $TAG_EXPECT, got: $TAG"
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release tag exists::$TAG already exists"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "title=${TAG#v}"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "channel=$CHANNEL"
            echo "apk_suffix=$APK_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KS_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD in repository secrets. Never publish a debug-signed release."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties
          # apksigner 无法给已经带 v2/v3 签名的 APK 追加 v1：必须从完全未签名的
          # APK 开始，一次性签 v1+v2+v3。这里只在 CI 工作副本里关闭 Gradle 签名。
          sed -i 's|signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug|signingConfig = null|' app/build.gradle
          grep -q 'signingConfig = null' app/build.gradle || {
            echo "::error title=Unsigned build not configured::Failed to disable Gradle signing in app/build.gradle"
            exit 1
          }
          echo "Release signing configured (Gradle outputs unsigned APKs)"

      - name: Build two release APKs
        id: build_apks
        env:
          WEBHTV_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ steps.meta.outputs.apk_suffix }}
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          set -o pipefail
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Report build failure
        if: failure() && steps.build_apks.outcome == 'failure'
        run: |
          echo "::group::Gradle build failure detail"
          if [ -f /tmp/gradle-build.log ]; then
            grep -nE "error:|^e: |FAILED|What went wrong|Execution failed|Caused by:|AAPT|Android resource linking failed|cannot find symbol|package .* does not exist|Duplicate resources|Compilation failed|Unresolved reference|resource .* not found" /tmp/gradle-build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            echo "---- last 80 lines ----"
            tail -80 /tmp/gradle-build.log
          fi
          echo "::endgroup::"

      - name: Collect artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          # 未签名产物可能带 -unsigned 后缀，统一成规范文件名，避免资产名漂移
          for f in Release/apk/*.apk; do
            b="$(basename "$f" .apk)"
            b="${b%-unsigned}"
            cp "$f" "dist/$b.apk"
          done
          ls -lh dist/

      - name: Add v1 (JAR) signature
        # 输入是 Gradle 输出的未签名 APK，这里一次性签 v1+v2+v3
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          APKSIGNER="$BT_DIR/apksigner"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          STORE_PASS="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASS}"
          for apk in dist/*.apk; do
            echo "== signing $apk with v1+v2+v3"
            # Gradle 产出的「未签名」APK 仍可能带第三方 jar 自带的
            # META-INF/*.SF / *.RSA / *.DSA / *.EC 和 MANIFEST.MF。apksigner 只追加
            # 自己那套、不清理旧的；MT 逐个校验 META-INF 签名文件，遇到旧的对不上
            # 当前证书就判「校验不通过」，而 apksigner verify 仍显示 v1+v2+v3 全 true。
            LEGACY="$(unzip -Z1 "$apk" | grep -iE '^META-INF/.*\.(SF|RSA|DSA|EC)$|^META-INF/MANIFEST\.MF$' || true)"
            if [ -n "$LEGACY" ]; then
              echo "  removing stale JAR signature entries:"
              echo "$LEGACY" | sed 's/^/    /'
              while IFS= read -r entry; do
                [ -z "$entry" ] || zip -d -q "$apk" "$entry" || true
              done <<< "$LEGACY"
            fi
            PRE="$("$APKSIGNER" verify --min-sdk-version 21 --verbose "$apk" 2>&1 || true)"
            if echo "$PRE" | grep -qi "verified using"; then
              echo "::error title=APK already signed::$apk already carries signatures; unsigned build is required"
              exit 1
            fi
            "$APKSIGNER" sign \
              --ks app/signing/release.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "${apk}.signed" "$apk"
            mv "${apk}.signed" "$apk"
            VERBOSE="$("$APKSIGNER" verify --min-sdk-version 21 --verbose "$apk" 2>&1 || true)"
            SIGFILES="$(unzip -l "$apk" | grep -icE 'META-INF/.*\.(RSA|DSA|EC|SF)' || true)"
            echo "v1 files in META-INF: $SIGFILES"
            echo "$(echo "$VERBOSE" | tr '\n' ' ')"
            if [ "$SIGFILES" -lt 1 ] || ! echo "$VERBOSE" | grep -qi "v1 scheme.*: true"; then
              echo "::error title=v1 signing failed::$(echo "$VERBOSE" | tr '\n' ' ') | META-INF signature files=$SIGFILES"
              exit 1
            fi
            # MT 口径：META-INF 里必须恰好一个签名块，不能混第二套证书
            SIGCOUNT="$(unzip -Z1 "$apk" | grep -icE '^META-INF/.*\.(RSA|DSA|EC)$' || true)"
            if [ "$SIGCOUNT" -ne 1 ]; then
              echo "::error title=Multiple JAR signatures::$apk has $SIGCOUNT signature blocks in META-INF; MT reports verification failure"
              exit 1
            fi
          done
          echo "v1+v2+v3 signing completed for all APKs"

      - name: Verify APK signatures and package identity
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          APKSIGNER="$BT_DIR/apksigner"
          AAPT2="$BT_DIR/aapt2"
          test -x "$APKSIGNER" && test -x "$AAPT2"
          count=0
          for apk in dist/*.apk; do
            echo "== $apk"
            PKG="$("$AAPT2" dump packagename "$apk")"
            echo "  package: $PKG"
            if [ "$PKG" != "com.fongmi.android.oktv" ]; then
              echo "::error title=Wrong applicationId::$PKG"
              exit 1
            fi
            CERTS="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"
            echo "$CERTS"
            VERBOSE="$("$APKSIGNER" verify --min-sdk-version 21 --verbose "$apk" 2>&1)"
            SIGFILES="$(unzip -l "$apk" | grep -icE 'META-INF/.*\.(RSA|DSA|EC|SF)' || true)"
            echo "  v1 files in META-INF: $SIGFILES"
            if [ "$SIGFILES" -lt 1 ] || ! echo "$VERBOSE" | grep -qi "v1 scheme.*: true"; then
              echo "::error title=V1 signature missing::$apk has no JAR (v1) signature; MT / some installers report it as unsigned. $(echo "$VERBOSE" | tr '\n' ' ') | META-INF signature files=$SIGFILES"
              exit 1
            fi
            SIGCOUNT="$(unzip -Z1 "$apk" | grep -icE '^META-INF/.*\.(RSA|DSA|EC)$' || true)"
            if [ "$SIGCOUNT" -ne 1 ]; then
              echo "::error title=Multiple JAR signatures::$apk has $SIGCOUNT signature blocks; MT reports verification failure"
              exit 1
            fi
            # apksigner 对 AGP 写入 META-INF 的元数据文件总会报
            # "not protected by signature"（app-metadata.properties、
            # version-control-info.textproto、androidx.*.version 等）。这是
            # 标准提示、与签名有效性无关，MT 也不会因此判不通过。
            # 只拦截除此之外的 WARNING，避免把正常包挡在门外。
            OTHER_WARN="$(echo "$VERBOSE" | grep -i 'WARNING' | grep -viE 'not protected by signature' || true)"
            if [ -n "$OTHER_WARN" ]; then
              echo "::error title=apksigner warning::$(echo "$OTHER_WARN" | tr '\n' ' ')"
              exit 1
            fi
            if echo "$CERTS" | grep -qi "Android Debug"; then
              echo "::error title=Debug-signed APK::Refusing to publish a debug-signed release."
              exit 1
            fi
            if ! echo "$CERTS" | grep -q "CN=xbox-re"; then
              echo "::error title=Unexpected signer::Release keystore was not used."
              exit 1
            fi
            count=$((count+1))
          done
          test "$count" -eq 2 || { echo "::error title=APK count::Expected 2 APKs, got $count"; exit 1; }
          echo "Verified $count release-signed APKs with the oktv applicationId"
          # 可下载的自检报告：用户能拿 MT 显示的证书指纹 / 签名方案直接对照，
          # 不必依赖 CI 自述，也不必下载几十 MB 的 APK 去验。
          {
            echo "xbox-re 签名自检报告"
            echo "tag: ${{ steps.meta.outputs.tag }}"
            echo "commit: $GITHUB_SHA"
            echo "SHA256 证书指纹: 82:7C:75:5F:F6:04:3C:5B:3B:F0:65:8B:BD:21:10:C5:79:88:6C:9B:DC:91:55:CA:00:4A:BF:66:E5:59:D5:7B"
            echo ""
            for apk in dist/*.apk; do
              echo "=== $(basename "$apk") ==="
              echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
              echo "package: $("$AAPT2" dump packagename "$apk")"
              echo "META-INF 条目:"
              unzip -Z1 "$apk" | grep -iE '^META-INF/' | sed 's/^/  /'
              echo "apksigner verify:"
              "$APKSIGNER" verify --min-sdk-version 21 --verbose "$apk" 2>&1 | sed 's/^/  /'
              echo "证书:"
              "$APKSIGNER" verify --print-certs "$apk" 2>&1 | sed 's/^/  /'
              echo ""
            done
          } > dist/signature-report.txt
          echo "signature-report.txt generated"

      - name: Set up ORAS
        id: oras
        if: ${{ inputs.publish_oci }}
        continue-on-error: true
        uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454

      - name: Publish APKs to OCI Registry
        id: oci
        if: ${{ inputs.publish_oci && steps.oras.outcome == 'success' }}
        continue-on-error: true
        env:
          DIST_DIR: dist
          OCI_METADATA_FILE: build/oci-metadata.json
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
        run: bash .github/scripts/publish-oci-apks.sh

      - name: Report OCI publish failure
        if: ${{ inputs.publish_oci && (steps.oras.outcome == 'failure' || steps.oci.outcome == 'failure') }}
        run: echo "::warning title=OCI publish unavailable::GitHub release will continue without OCI metadata."

      - name: Prepare release notes input
        id: release_notes
        env:
          RELEASE_NOTES_RAW: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import os

          raw = os.environ.get("RELEASE_NOTES_RAW", "").strip()
          notes = (
              raw
              .replace("\\r\\n", "\n")
              .replace("\\n", "\n")
              .replace("\\t", "\t")
              .replace('\\"', '"')
              .replace("\\'", "'")
          )
          delimiter = "RELEASE_NOTES_EOF"
          while delimiter in notes:
              delimiter += "_"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_notes={'true' if notes else 'false'}\n")
              fh.write(f"notes<<{delimiter}\n")
              fh.write(notes)
              if notes and not notes.endswith("\n"):
                  fh.write("\n")
              fh.write(f"{delimiter}\n")
          PY

      - name: Generate update manifests
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          GITHUB_RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}
          OCI_PUBLISH_OUTCOME: ${{ steps.oci.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          tag = "${{ steps.meta.outputs.tag }}"
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          release_download_base = os.environ["GITHUB_RELEASE_DOWNLOAD_BASE"]
          oci = {}
          oci_metadata = "build/oci-metadata.json"
          if os.environ.get("OCI_PUBLISH_OUTCOME") == "success" and os.path.isfile(oci_metadata):
              with open(oci_metadata, encoding="utf-8") as fh:
                  oci = json.load(fh)
          for apk in glob.glob("dist/*.apk"):
              base = os.path.splitext(os.path.basename(apk))[0]
              with open(apk, "rb") as fh:
                  content = fh.read()
              data = {
                  "name": tag,
                  "versionName": "${{ steps.meta.outputs.version_name }}",
                  "desc": f"{tag} - ${{ steps.meta.outputs.short_sha }}",
                  "channel": "${{ steps.meta.outputs.channel }}",
                  "code": int("${{ steps.meta.outputs.version_code }}"),
                  "apk": f"{release_download_base}/{base}.apk",
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "downloads": {
                      "github": {"url": f"{release_download_base}/{base}.apk"},
                  },
              }
              if base in oci:
                  descriptor = oci[base]
                  if descriptor.get("size") != len(content) or descriptor.get("layerDigest") != "sha256:" + data["sha256"]:
                      raise SystemExit(f"OCI descriptor does not match {base}.apk")
                  data["downloads"]["oci"] = descriptor
              if notes:
                  data["notes"] = notes
              with open(f"dist/{base}.json", "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
                  fh.write("\n")
          PY
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          ls -lh dist/
          python3 - <<'PY'
          import glob, json, os, urllib.error, urllib.parse, urllib.request

          tag = "${{ steps.meta.outputs.tag }}"
          title = "${{ steps.meta.outputs.title }}"
          notes = os.environ.get("RELEASE_NOTES", "").strip() or "手动触发 GitHub Actions 构建发布。"
          prerelease = ("${{ inputs.prerelease }}" == "true") or ("${{ steps.meta.outputs.channel }}" == "beta")
          token = os.environ["GH_TOKEN"]
          repo = "${{ github.repository }}"
          api = "https://api.github.com"
          base = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                  "User-Agent": "webhtv-release", "X-GitHub-Api-Version": "2022-11-28"}

          def call(method, url, data=None, raw=None, ctype="application/json"):
              headers = dict(base)
              headers["Content-Type"] = ctype
              body = raw if raw is not None else (json.dumps(data).encode() if data is not None else None)
              req = urllib.request.Request(url, method=method, data=body, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      text = resp.read().decode()
                      return resp.status, (json.loads(text) if text.strip() else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          status, body = call("GET", api + "/repos/" + repo + "/releases/tags/" + tag)
          if status == 200:
              rel = body
              print("Release already exists, reuse:", tag)
          else:
              status, rel = call("POST", api + "/repos/" + repo + "/releases", {
                  "tag_name": tag, "target_commitish": os.environ["GITHUB_SHA"],
                  "name": title, "body": notes, "draft": False, "prerelease": prerelease})
              if status not in (200, 201):
                  print("::error title=Create release failed::HTTP %s %s" % (status, rel))
                  raise SystemExit(1)
              print("Release created:", tag)
          upload_url = rel["upload_url"].split("{")[0]
          assets = sorted(set(glob.glob("dist/*.apk") + glob.glob("dist/*.json")))
          print("assets:", assets)
          if not assets:
              raise SystemExit("::error title=No release assets::dist is empty")
          for path in assets:
              name = os.path.basename(path)
              with open(path, "rb") as f:
                  data = f.read()
              url = upload_url + "?name=" + urllib.parse.quote(name)
              status, body = call("POST", url, raw=data, ctype="application/octet-stream")
              if status in (200, 201):
                  print("uploaded:", name)
              elif status == 422 and "already_exists" in str(body):
                  print("asset exists, skip:", name)
              else:
                  print("::error title=Upload asset failed::%s HTTP %s %s" % (name, status, body))
                  raise SystemExit(1)
          print("Release ready:", tag)
          PY

      - name: Sync to CNB
        if: ${{ inputs.sync_cnb }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          CNB_RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          CNB_RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          CNB_RELEASE_PRERELEASE: ${{ inputs.prerelease == true || steps.meta.outputs.channel == 'beta' }}
          CNB_RELEASE_LATEST: ${{ steps.meta.outputs.channel == 'stable' }}
        run: |
          .github/scripts/sync-cnb-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
