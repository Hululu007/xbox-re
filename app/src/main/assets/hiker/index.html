<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海阔 · 视界</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1220;--card:#1a2438;--card2:#202c44;--line:#2c3a56;
  --txt:#eaf0fb;--sub:#93a4c2;--dim:#63748f;--acc:#5db4ff;--acc2:#8a7dff;
  --ok:#4fd39a;--warn:#ffb45e;--bad:#ff7b7b;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:15px/1.6 -apple-system,"Noto Sans CJK SC","PingFang SC",sans-serif;
  background-image:radial-gradient(1200px 600px at 10% -10%,#1a2a4a 0%,transparent 60%),
                   radial-gradient(900px 500px at 110% 0%,#2a1f4a 0%,transparent 55%);
  min-height:100%}
.app{max-width:1080px;margin:0 auto;padding:0 14px calc(26px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 2px 12px;background:linear-gradient(180deg,rgba(13,18,32,.97),rgba(13,18,32,.82) 70%,transparent);
  backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:.5px}
.logo{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;
  color:#0b1220;font-weight:900;font-size:16px;box-shadow:0 4px 16px rgba(93,180,255,.35)}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--sub);letter-spacing:2px;line-height:1}
.crumb{flex:1;min-width:0;color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.view{display:none;animation:fade .22s ease}
.view.cur{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{padding:18px 2px 8px}
.hero h1{margin:0 0 6px;font-size:23px;font-weight:800}
.hero p{margin:0 0 16px;color:var(--sub);font-size:13px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.modes button{flex:1;min-width:96px;background:var(--card);color:var(--sub);border:1px solid var(--line);
  border-radius:12px;padding:11px 8px;font-size:14px;cursor:pointer;font-weight:600}
.modes button.cur{background:linear-gradient(135deg,#244a7a,#3a3270);border-color:var(--acc);color:#fff;
  box-shadow:0 4px 16px rgba(93,180,255,.18)}
.modes button b{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{display:block;font-size:12px;color:var(--sub);margin:0 0 7px;font-weight:600}
textarea{width:100%;min-height:118px;background:#0b1120;color:var(--txt);border:1px solid var(--line);
  border-radius:11px;padding:12px;font:13px/1.6 monospace;resize:vertical;outline:none}
textarea:focus{border-color:var(--acc)}
input.f{width:100%;background:#0b1120;color:var(--txt);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font:14px/1.4 -apple-system,sans-serif;outline:none}
input.f:focus{border-color:var(--acc)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border-radius:11px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#0b1220;flex:1;min-width:150px;
  box-shadow:0 6px 18px rgba(93,180,255,.28)}
.btn.gh{background:var(--card2);color:var(--txt)}
.btn.sm{padding:8px 13px;font-size:13px;font-weight:600}
.btn:active{transform:translateY(1px)}
.hintline{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.7}
.hintline code{color:var(--acc);font:12px monospace}
.imports{display:none;gap:8px;flex-wrap:wrap;margin-top:12px}
.imports.show{display:flex}
.filelab{position:relative;overflow:hidden;display:inline-block}
.filelab input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.posters{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;
  transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card:active{transform:scale(.98)}
.card:hover{border-color:var(--acc)}
.site-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:#0b1220;margin-bottom:11px}
.site-nm{font-weight:700;font-size:15px;margin-bottom:3px;word-break:break-all}
.site-mt{font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font:10px/1 monospace;padding:3px 7px;border-radius:6px;background:#26344b;color:var(--sub)}
.pill.ok{background:#1d4433;color:var(--ok)}
.poster{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;transition:transform .15s}
.poster:active{transform:scale(.97)}
.poster .ph{aspect-ratio:2/3;background:linear-gradient(135deg,#22304c,#2a2450);display:flex;align-items:center;
  justify-content:center;color:#5a6f96;font-size:30px;font-weight:800}
.poster .ph img{width:100%;height:100%;object-fit:cover}
.poster .pt{padding:8px 9px 10px}
.poster .pt b{display:block;font-size:13px;font-weight:600;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .pt span{font-size:11px;color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar{display:flex;gap:9px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.toolbar .f{flex:1;min-width:150px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--sub);
  border-radius:20px;padding:7px 15px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.cur{background:var(--acc);color:#0b1220;border-color:var(--acc);font-weight:700}
.detail-hero{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.detail-hero .ph{width:120px;aspect-ratio:2/3;border-radius:11px;flex:none;
  background:linear-gradient(135deg,#22304c,#2a2450);display:flex;align-items:center;justify-content:center;
  color:#5a6f96;font-size:38px;font-weight:800;overflow:hidden}
.detail-hero .ph img{width:100%;height:100%;object-fit:cover}
.detail-hero .info{flex:1;min-width:0}
.detail-hero h2{margin:2px 0 8px;font-size:19px}
.detail-hero p{margin:0;color:var(--sub);font-size:13px;line-height:1.7}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin-top:6px}
.ep{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;
  font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep:active{background:var(--acc);color:#0b1220}
.sect-t{font-size:15px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.sect-t:before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
.empty{color:var(--dim);text-align:center;padding:36px 12px;font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.5}
.notice{background:#3a2a18;border:1px solid #6b4a22;color:var(--warn);border-radius:11px;
  padding:10px 13px;font-size:13px;margin:10px 0}
.notice.info{background:#16283f;border-color:#2c4a70;color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:#0b1120ee;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:12px;
  font-size:14px;z-index:50;opacity:0;transition:.25s;max-width:88%;text-align:center;box-shadow:0 8px 30px #0008}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.history{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hist{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;
  color:var(--sub);cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{color:var(--dim);font-size:11px;text-align:center;padding:22px 0 6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="btnBack" style="display:none" aria-label="返回">&lsaquo;</button>
    <div class="brand"><span class="logo">海</span><span>海阔<small>HIKER VIEW</small></span></div>
    <div class="crumb" id="crumb">录入口令，生成站点</div>
    <span class="dot" id="netDot" title="同步桥状态"></span>
  </header>

  <!-- ① 录口令 -->
  <section class="view cur" data-v="input">
    <div class="hero">
      <h1>录入口令，生成站点</h1>
      <p>粘贴海阔口令或配置地址 → 一键生成站点 → 点站点即可进入播放。</p>
    </div>
    <div class="modes" id="modes">
      <button data-m="single" class="cur">单口令<b>一条口令</b></button>
      <button data-m="multi">多口令<b>换行 / 分号分隔</b></button>
      <button data-m="password">含密码<b>口令 + 访问密码</b></button>
      <button data-m="import">导入<b>粘贴 / 文件 / 剪贴板</b></button>
    </div>
    <div class="box">
      <label class="lbl" id="codeLbl">口令 / 配置地址</label>
      <textarea id="code" placeholder="粘贴云口令、分享口令、规则 JSON 或配置 URL…&#10;例：小程序￥home_rule￥{…}&#10;或：云6oooole/xxxxxx/abc123"></textarea>
      <div id="pwdWrap" style="display:none;margin-top:12px">
        <label class="lbl">访问密码（云便签 / 加密口令）</label>
        <input class="f" id="pwd" type="password" placeholder="可选，口令自带 (@密码) 时可留空">
      </div>
      <div class="row">
        <button class="btn primary" id="btnGen">生成站点 →</button>
        <button class="btn gh" id="btnDemo">载入演示</button>
        <button class="btn gh" id="btnClear">清空</button>
      </div>
      <div class="imports" id="imports">
        <button class="btn gh sm" id="btnPaste">粘贴文本</button>
        <button class="btn gh sm" id="btnClip">读取剪贴板</button>
        <label class="btn gh sm filelab">选择文件<input type="file" id="fileIn" accept=".txt,.json,.js,.md,*"></label>
      </div>
      <div class="hintline" id="hint">
        支持 <code>云1~云10 oooole/…</code>（可带 <code>(@密码)</code>）、<code>￥home_rule￥{json}</code> 分享口令、
        <code>base64://@标题@…</code>、规则 JSON / 数组、TVBox 配置 URL、<code>名称,http://…</code>。
      </div>
    </div>
    <div class="sect-t">最近录入</div>
    <div class="history" id="history"><span class="hintline">暂无记录</span></div>
    <div id="genNote"></div>
  </section>

  <!-- ② 站点列表 -->
  <section class="view" data-v="sites">
    <div class="sect-t" id="siteTitle">我的站点</div>
    <div class="grid" id="siteGrid"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn gh sm" id="btnAddMore">＋ 继续录口令</button>
      <button class="btn gh sm" id="btnDemo2">载入演示站点</button>
      <button class="btn gh sm" id="btnClearSites">清空站点</button>
    </div>
  </section>

  <!-- ③ 站点内容 -->
  <section class="view" data-v="content">
    <div class="toolbar">
      <input class="f" id="kw" placeholder="在此站点内搜索…">
      <button class="btn primary sm" id="btnSearch" style="flex:none;min-width:0">搜索</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="listNote"></div>
    <div class="grid posters" id="vodGrid"></div>
  </section>

  <!-- ④ 详情 -->
  <section class="view" data-v="detail">
    <div class="detail-hero" id="detailHero"></div>
    <div class="sect-t">选集 · 点击播放</div>
    <div class="eps" id="eps"></div>
    <div id="detailNote"></div>
  </section>

  <footer>海阔独立运行时 · 独立 WebView / 同步桥 · 口令 → 站点 → 播放</footer>
</div>
<div class="toast" id="toast"></div>

<!-- 运行时层（顺序不可变）：独立同步桥 → scheme → API 契约 → JsT4 → shim → 兼容层 → 应用逻辑 -->
<script src="hiker_bridge_adapter.js"></script>
<script src="hiker_scheme.js"></script>
<script src="hiker_api_surface.js"></script>
<script src="jst4.js"></script>
<script src="hiker_runtime_shim.js"></script>
<script src="hiker_compat.js"></script>
<script src="hiker_app.js"></script>
<script>
/* 容器页 UI 逻辑：ES5，旧 WebView 兼容（Chromium 50~70） */
(function () {
  'use strict';
  var G = window, A = window.HikerApp;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;'); };
  var S = { mode: 'single', sites: [], stack: [], site: null, vods: [], classes: [], cls: '', vod: null, detail: null };

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }
  function show(v, crumb, canBack) {
    var vs = document.getElementsByTagName('section'), i;
    for (i = 0; i < vs.length; i++) vs[i].className = 'view' + (vs[i].getAttribute('data-v') === v ? ' cur' : '');
    $('crumb').textContent = crumb || '';
    $('btnBack').style.display = canBack ? 'flex' : 'none';
    window.scrollTo(0, 0);
  }
  function push(v, crumb) { S.stack.push({ v: v, crumb: crumb }); apply(); }
  function apply() {
    var top = S.stack[S.stack.length - 1];
    if (!top) { show('input', '录入口令，生成站点', false); return; }
    show(top.v, top.crumb, true);
  }
  function goInput() { S.stack = []; show('input', '录入口令，生成站点', false); }
  function goSites() { S.stack = []; push('sites', '我的站点 · ' + S.sites.length + ' 个'); renderSites(); }
  $('btnBack').onclick = function () {
    if (!S.stack.length) { goInput(); return; }
    S.stack.pop();
    if (!S.stack.length) goInput(); else apply();
  };

  /* 静默装配运行时层；这一层只负责执行规则，不给用户展示任何调试信息 */
  function boot() {
    try {
      if (G.HikerCompat && G.HikerCompat.install) {
        G.HikerCompat.install({ isolation: 'strict',
          page: { MOBILE_UA: navigator.userAgent, PC_UA: '' },
          onResult: function () {} });
      }
    } catch (e) {}
    A.wire();
    var offline = !!(G.HikerHost && G.HikerHost.isOffline);
    $('netDot').className = 'dot' + (offline ? ' off' : '');
    $('netDot').title = offline ? '离线：云口令/配置地址需联网，演示站点可完整体验' : '同步桥已连接';
    S.sites = A.load('sites', []) || [];
    renderHistory();
    if (S.sites.length) goSites();
  }

  /* ---------- 录口令 ---------- */
  var modeHint = {
    single: '支持 <code>云1~云10 oooole/…</code>、<code>￥home_rule￥{json}</code>、<code>base64://@标题@…</code>、规则 JSON、配置 URL、<code>名称,http://…</code>。',
    multi: '每行一条口令，或用 <code>;</code> 分隔；多条口令的站点会合并去重。',
    password: '口令里含 <code>(@密码)</code> 或分享人设了访问密码时，用此模式；也可在下方填密码。',
    import: '粘贴整段文本、从文件导入，或读取系统剪贴板；会自动识别分享包装 / JSON 数组 / 多口令。'
  };
  $('modes').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : e.target;
    if (!b || !b.getAttribute('data-m')) return;
    S.mode = b.getAttribute('data-m');
    var bs = $('modes').getElementsByTagName('button'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = (bs[i] === b ? 'cur' : '');
    $('pwdWrap').style.display = (S.mode === 'password') ? 'block' : 'none';
    $('imports').className = 'imports' + (S.mode === 'import' ? ' show' : '');
    $('hint').innerHTML = modeHint[S.mode];
    $('codeLbl').textContent = (S.mode === 'multi' || S.mode === 'import') ? '口令（可多行 / 整段）' : '口令 / 配置地址';
  });
  function addHistory(text) {
    var h = A.load('history', []);
    h = [String(text).slice(0, 160)].concat(h.filter(function (x) { return x !== text; })).slice(0, 6);
    A.save('history', h); renderHistory();
  }
  function renderHistory() {
    var h = A.load('history', []), out = '', i;
    for (i = 0; i < h.length; i++) out += '<span class="hist" data-h="' + i + '" title="' + esc(h[i]) + '">' + esc(h[i]) + '</span>';
    $('history').innerHTML = out || '<span class="hintline">暂无记录</span>';
  }
  $('history').addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-h');
    if (i === null || i === undefined) return;
    var h = A.load('history', []); $('code').value = h[+i] || '';
    toast('已填入历史口令');
  });
  function doGenerate(text) {
    text = String(text || '').replace(/^\s+|\s+$/g, '');
    if (!text) { toast('请先录入口令'); return; }
    var res = A.generate(text, { mode: S.mode, password: $('pwd').value });
    addHistory(text);
    var html = '';
    if (res.notes.length) html += '<div class="notice info">' + esc(res.notes.join('　·　')) + '</div>';
    if (res.warnings.length) html += '<div class="notice">' + esc(res.warnings.join('　·　')) + '</div>';
    $('genNote').innerHTML = html;
    if (!res.count) { toast('未生成站点：' + (res.notes[0] || '请检查口令')); return; }
    var seen = {}, merged = [], i;
    for (i = 0; i < res.sites.length; i++) { seen[res.sites[i].key] = 1; merged.push(res.sites[i]); }
    for (i = 0; i < S.sites.length; i++) if (!seen[S.sites[i].key]) merged.push(S.sites[i]);
    S.sites = merged; A.save('sites', S.sites);
    toast('已生成 ' + res.count + ' 个站点');
    goSites();
  }
  $('btnGen').onclick = function () { doGenerate($('code').value); };
  $('btnClear').onclick = function () { $('code').value = ''; $('pwd').value = ''; $('genNote').innerHTML = ''; };
  $('btnDemo').onclick = function () {
    /* 走真实链路：把一份配置口令填进输入框 → doGenerate 解析 → 生成带规则的站点 */
    var cfg = A.demoConfig();
    $('code').value = cfg;
    S.mode = 'single';
    var bs = $('modes').getElementsByTagName('button'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = (bs[i].getAttribute('data-m') === 'single' ? 'cur' : '');
    $('pwdWrap').style.display = 'none'; $('imports').className = 'imports';
    doGenerate(cfg);
  };
  $('btnPaste').onclick = function () {
    var v = window.prompt('粘贴整段口令 / 配置文本：');
    if (v) { $('code').value = v; toast('已填入 ' + v.length + ' 字符'); }
  };
  $('btnClip').onclick = function () {
    if (G.navigator && navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) { $('code').value = t || ''; toast(t ? '已读取剪贴板' : '剪贴板为空'); })
        .catch(function () { toast('剪贴板不可用，请用「粘贴文本」'); });
    } else {
      var v = window.prompt('此环境无法直接读剪贴板，请粘贴：');
      if (v) { $('code').value = v; toast('已填入'); }
    }
  };
  $('fileIn').onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { $('code').value = String(rd.result || ''); toast('已导入 ' + f.name); };
    rd.onerror = function () { toast('文件读取失败'); };
    rd.readAsText(f, 'UTF-8');
  };

  /* ---------- 站点列表 ---------- */
  var COLORS = ['#5db4ff', '#4fd39a', '#ffb45e', '#8a7dff', '#ff8fb1', '#5fd0d3'];
  function renderSites() {
    $('siteTitle').textContent = '我的站点 · ' + S.sites.length + ' 个';
    if (!S.sites.length) { $('siteGrid').innerHTML = '<div class="empty"><span class="big">◇</span>还没有站点，回首页录入口令</div>'; return; }
    var h = '', i, st, c, initial;
    for (i = 0; i < S.sites.length; i++) {
      st = S.sites[i]; c = st.color || COLORS[i % COLORS.length];
      initial = (st.name || '?').replace(/[^0-9A-Za-z\u4e00-\u9fa5]/g, '').charAt(0) || '海';
      h += '<div class="card" data-si="' + i + '">'
        + '<div class="site-ic" style="background:' + c + '">' + esc(initial) + '</div>'
        + '<div class="site-nm">' + esc(st.name) + '</div>'
        + '<div class="site-mt"><span class="pill">' + (st.siteKind === 'rule' ? '规则站' : '配置站') + '</span>'
        + (st.searchable ? '<span class="pill ok">可搜索</span>' : '')
        + (st.group ? '<span class="pill">' + esc(st.group) + '</span>' : '') + '</div></div>';
    }
    $('siteGrid').innerHTML = h;
  }
  $('siteGrid').addEventListener('click', function (e) {
    var n = e.target, idx = null;
    while (n && n !== this) { if (n.getAttribute && n.getAttribute('data-si') !== null) { idx = n.getAttribute('data-si'); break; } n = n.parentNode; }
    if (idx === null) return;
    openSite(S.sites[+idx]);
  });
  $('btnAddMore').onclick = goInput;
  $('btnDemo2').onclick = function () {
    var res = A.generate(A.demoConfig(), { mode: 'single' });
    var seen = {}, merged = res.sites.slice(), i;
    for (i = 0; i < merged.length; i++) seen[merged[i].key] = 1;
    for (i = 0; i < S.sites.length; i++) if (!seen[S.sites[i].key]) merged.push(S.sites[i]);
    S.sites = merged; A.save('sites', S.sites); renderSites(); toast('已载入演示站点');
  };
  $('btnClearSites').onclick = function () { S.sites = []; A.save('sites', []); renderSites(); toast('已清空站点'); };

  /* ---------- 站点内容（home / cate / search） ---------- */
  function openSite(st) {
    S.site = st; S.cls = '';
    var r = A.home(st);
    S.classes = r.classes.length ? r.classes : (st.categories || []);
    S.vods = r.vods;
    push('content', st.name);
    renderChips(); renderVods(); renderListNote(r);
  }
  function renderListNote(r) {
    var h = '';
    if (!r.vods.length && r.action === 'degrade') {
      h = '<div class="notice">该站点首页规则需要 ' + esc(r.degrade || '内核引擎') +
          '，本独立 WebView 只能执行 js: 规则片段；可点「载入演示站点」体验完整链路。</div>';
    } else if (!r.vods.length && r.err && r.action !== 'no-rule') {
      h = '<div class="notice">规则未产出内容：' + esc(r.err) + '</div>';
    } else if (r.action === 'no-rule') {
      h = '<div class="notice">此站点来自配置，未提供可在 WebView 执行的首页规则（home/find_rule）；' +
          '配置型站点（csp_/jar/X5）需 App 原生引擎，独立 WebView 不接管。</div>';
    }
    $('listNote').innerHTML = h;
  }
  function renderChips() {
    var h = '', i;
    if (!S.classes.length) { $('chips').innerHTML = ''; return; }
    for (i = 0; i < S.classes.length; i++)
      h += '<span class="chip' + (S.cls === S.classes[i] || (i === 0 && !S.cls) ? ' cur' : '') + '" data-c="' + esc(S.classes[i]) + '">' + esc(S.classes[i]) + '</span>';
    $('chips').innerHTML = h;
  }
  $('chips').addEventListener('click', function (e) {
    var c = e.target.getAttribute && e.target.getAttribute('data-c');
    if (c === null || c === undefined) return;
    S.cls = c;
    var r = A.cate(S.site, c);
    S.vods = r.vods; renderChips(); renderVods(); renderListNote(r);
  });
  $('btnSearch').onclick = function () {
    var kw = $('kw').value.replace(/^\s+|\s+$/g, '');
    if (!kw) { toast('请输入关键词'); return; }
    if (!S.site) return;
    var r = A.search(S.site, kw);
    S.cls = ''; S.vods = r.vods; renderChips(); renderVods(); renderListNote(r);
    toast('搜索「' + kw + '」：' + r.vods.length + ' 条');
  };
  function renderVods() {
    if (!S.vods.length) { $('vodGrid').innerHTML = '<div class="empty"><span class="big">▤</span>暂无内容</div>'; return; }
    var h = '', i, v, ph;
    for (i = 0; i < S.vods.length; i++) {
      v = S.vods[i];
      ph = v.pic ? '<img src="' + esc(v.pic) + '" alt="">' : esc((v.title || '海').charAt(0));
      h += '<div class="poster" data-vi="' + i + '"><div class="ph">' + ph + '</div>'
        + '<div class="pt"><b>' + esc(v.title) + '</b><span>' + esc(v.desc || '') + '</span></div></div>';
    }
    $('vodGrid').innerHTML = h;
  }
  $('vodGrid').addEventListener('click', function (e) {
    var n = e.target, idx = null;
    while (n && n !== this) { if (n.getAttribute && n.getAttribute('data-vi') !== null) { idx = n.getAttribute('data-vi'); break; } n = n.parentNode; }
    if (idx === null) return;
    openDetail(S.vods[+idx]);
  });

  /* ---------- 详情 / 选集 / 播放 ---------- */
  function openDetail(v) {
    S.vod = v;
    var d = A.detail(S.site, v);
    S.detail = d;
    var ph = d.pic ? '<img src="' + esc(d.pic) + '" alt="">' : esc((v.title || '海').charAt(0));
    $('detailHero').innerHTML = '<div class="ph">' + ph + '</div><div class="info">'
      + '<h2>' + esc(v.title) + '</h2><p>' + esc(d.desc || '暂无简介') + '</p>'
      + '<div style="margin-top:10px"><span class="pill">' + esc(S.site.name) + '</span> '
      + '<span class="pill ' + (d.episodes.length ? 'ok' : '') + '">' + d.episodes.length + ' 集</span></div></div>';
    var h = '', i;
    for (i = 0; i < d.episodes.length; i++)
      h += '<div class="ep" data-ei="' + i + '" title="' + esc(d.episodes[i].name) + '">' + esc(d.episodes[i].name) + '</div>';
    $('eps').innerHTML = h || '<div class="empty" style="grid-column:1/-1">该剧集列表为空</div>';
    var note = '';
    if (d.action === 'degrade') note = '<div class="notice">详情规则需 ' + esc(d.degrade) + ' 引擎，已降级。</div>';
    else if (!d.episodes.length && d.err) note = '<div class="notice">详情规则未产出选集：' + esc(d.err) + '</div>';
    $('detailNote').innerHTML = note;
    push('detail', v.title);
  }
  $('eps').addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-ei');
    if (i === null || i === undefined) return;
    var ep = S.detail.episodes[+i];
    var r = A.playEpisode(S.site, S.vod, ep);
    if (r.ok) toast('▶ ' + ep.name + ' 已交给 App 播放器');
    else toast('播放失败：' + (r.err || '无地址'));
  });

  boot();
  G.__HIKER_APP_STATE__ = S;
})();
</script>
</body>
</html>
